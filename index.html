 let cm=new Date;cm.setDate(1);const cd=()=>{const y=cm.getFullYear(),m=cm.getMonth();$('#mt').textContent=cm.toLocaleString('en',{month:'long',year:'numeric'});let h=['S','M','T','W','T','F','S'].map(d=>'<div class="mu">'+d+'</div>').join('');for(let i=0;i<cm.getDay();i++)h+='<div></div>';for(let d=1;d<=new Date(y,m+1,0).getDate();d++){const k=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');h+='<div class="'+(S.ev.some(e=>e.d==k)?'ev ':'')+(k==today()?'td':'')+'">'+d+'</div>'}$('#cal').innerHTML=h;S.ev.sort((a,b)=>a.d>b.d?1:-1);$('#el').innerHTML=S.ev.map((e,i)=>'<div class="tk"><span>📌 '+e.d+' · '+esc(e.t)+'</span><button class="ib" data-v="'+i+'">'+ic('trash')+'</button></div>').join('')};cd();

ppear here.</p></div></div></div><div class="hd"><div class="k2" style="font-size:15px">HISTORY</div><input id="hs" class="sr" placeholder="Search '+(I?'images':'clips')+' by prompt…" style="max-width:300px"></div><div class="gal" id="ah"></div>');
 $$('.seg').forEach(s=>s.onclick=e=>{const b=e.target.closest('button');if(b){$$('button',s).forEach(x=>x.classList.toggle('on',x==b))}});
 const sg=s=>'<img src="data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s)+'">',L=()=>eval(S2),it=x=>typeof x=='string'?{p:'Earlier render',s:x}:x,hist=()=>{const f=($('#hs').value||'').trim().toLowerCase(),r=RH[k].map((x,i)=>({p:x.p,src:x.src,n:i})),a=L().map((x,i)=>({p:it(x).p,s:it(x).s,n:i})),all=[...r,...a].filter(x=>!f||x.p.toLowerCase().includes(f));$('#ah').innerHTML=all.map(x=>'<div data-'+(x.src?'r':'i')+'="'+x.n+'">'+(x.src?(k=='image'?'<img src="'+x.src+'">':'<video src="'+x.src+'" muted playsinline style="width:100%;border-radius:16px"></video>'):sg(x.s))+'<div class="cp2">'+esc(x.p)+'</div></div>').join('')||'<div class="mu">Nothing found.</div>'},show=s=>{$('#apv').innerHTML='<div style="width:100%;text-align:center">'+sg(s)+'<br><button id="dw" style="margin-top:12px">⬇ Download</button></div>';$('#dw').onclick=async()=>{try{const d=await claude.use('downloads');await d.save({filename:'orvyn-'+k+'.svg',data:s})}catch(e){toast('Download not available here')}}};hist();
 $('#hs').oninput=hist;$('#ah').onclick=e=>{const d=e.target.closest('[data-i],[data-r]');if(!d)return;if(d.dataset.r!=null){const x=RH[k][d.dataset.r];if(window.showReal)showReal(k,x.src,1,x.p)}else show(it(L()[d.dataset.i]).s)};
 $('#ag').onclick=async()=>{const p=$('#ap').value.trim();if(!p)return toast('Describe it first');if(SV&&(I?SV.image:SV.video))return real(k,p,I?$('#aa').value:$('#aa .on').textContent);const sel=I?$('#aa').value:$('#aa .on').textContent,vert=/9:16/.test(sel),sq=/1:1/.test(sel),vb=sq?'0 0 400 400':vert?'0 0 360 640':'0 0 640 360';$('#apv').innerHTML='<div class="ph">'+ic('sparkles')+'<h3>Creating…</h3></div>';
  const D3=' It must look convincingly 3D: strong perspective and depth, volumetric rounded forms built from layered linearGradient/radialGradient shading, specular highlights and rim light, ambient-occlusion shadows and soft drop shadows using feGaussianBlur filters, a lit ground plane with reflections, and blurred background layers for depth of field.';const spec=I?'a stunning, highly detailed 3D-rendered scene in a '+$('#as').value+' style ('+$('#aq .on').textContent+' quality).'+D3:'a looping animated 3D-looking scene lasting '+parseInt($('#ad .on').textContent)+' seconds, using SMIL <animate>/<animateTransform>. Use parallax with foreground, midground and background layers moving at different speeds, objects that appear to rotate in 3D (animate scale and skew), moving light and shadows, and smooth motion.'+D3;
  const r=await ai('Create '+spec+' of: '+p+'. Output ONLY one complete SVG document with viewBox="'+vb+'", no scripts, no external images, no explanation, no code fences.',null,true);const m=r&&r.match(/<svg[\s\S]*<\/svg>/);if(!m){$('#apv').innerHTML='<div class="ph">'+ic(k)+'<h3>Try again</h3><p>Use a simpler description.</p></div>';return}
  const a=L();a.unshift({p,s:m[0]});a.splice(8);save();show(m[0]);hist()}}

async function real(k,p,sel){const I=k=='image',pv=$('#apv'),a=/9:16/.test(sel)?'9:16':/16:9/.test(sel)?'16:9':'1:1';

 try{if(I){const r=await sf('/api/image',{method:'POST',body:JSON.stringify({prompt:p,style:$('#as').value,aspect:a,quality:$('#aq .on').textContent})}),j=await r.json();if(!r.ok)throw new Error(j.error||'Failed');showReal('image',j.image,0,p)}
 else{const r=await sf('/api/video',{method:'POST',body:JSON.stringify({prompt:p,aspect:a,duration:parseInt($('#ad .on').textContent)})}),j=await r.json();if(!r.ok)throw new Error(j.error||'Failed');for(let i=0;i<90;i++){await sl(4000);if(cur!=k)return;const s=await(await sf('/api/video/'+j.id)).json();if(s.status=='failed'||s.error)throw new Error(s.error||'Video failed');if(s.url)return showReal('video',s.url,0,p)}throw new Error('Timed out. Try again.')}}
 catch(e){pv.innerHTML='<div class="ph">'+ic(k)+'<h3>Couldn’t generate</h3><p>'+esc(e.message)+'</p></div>'}}
function showReal(k,src,again,p){const pv=$('#apv');if(!pv)return;pv.innerHTML='<div style="width:100%;text-align:center">'+(k=='image'?'<img src="'+src+'">':'<video src="'+src+'" controls autoplay loop playsinline style="max-width:100%;border-radius:18px"></video>')+'<div class="row" style="justify-content:center;margin:12px 0 0"><a href="'+src+'" download="orvyn-'+k+(k=='image'?'.png':'.mp4')+'" target="_blank" rel="noopener"><button>⬇ Download</button></a><button id="rg">'+ic('ref')+' Regenerate</button></div></div>';$('#rg').onclick=()=>$('#ag').click();
 if(!again){RH[k].unshift({p:p||'',src});$('#hs')&&$('#hs').dispatchEvent(new Event('input'))}}

function startGame(){const box=$('#gb');box.innerHTML='<canvas id="gc" width="360" height="420"></canvas><button class="pri" id="jb">⬆ Jump</button>';const c=$('#gc'),x=c.getContext('2d');let px=160,py=0,vy=0,sc=0,lv=3,it=[],f=0,over=false;
 c.onpointermove=e=>{const r=c.getBoundingClientRect();px=Math.max(0,Math.min(320,(e.clientX-r.left)*360/r.width-20))};
 const jump=()=>{if(py==0)vy=11},kd=e=>{if(e.key=='ArrowLeft')px=Math.max(0,px-24);if(e.key=='ArrowRight')px=Math.min(320,px+24);if(e.key=='ArrowUp'||e.key==' '){e.preventDefault();jump()}};document.addEventListener('keydown',kd);$('#jb').onclick=jump;
 (function loop(){if(over||!c.isConnected){document.removeEventListener('keydown',kd);return}f++;if(f%28==0)it.push({x:Math.random()*340,y:-16,s:Math.random()<.3,v:2+Math.random()*2+f/2500});
  py+=vy;vy-=.6;if(py<=0){py=0;vy=0}x.fillStyle='#07040f';x.fillRect(0,0,360,420);for(let i=0;i<30;i++){x.fillStyle='rgba(255,255,255,.25)';x.fillRect((i*97+f/3)%360,(i*53)%420,2,2)}
  const yy=380-py;x.fillStyle='#2ee283';x.fillRect(px,yy,40,22);x.fillStyle='#07040f';x.fillRect(px+8,yy+6,6,6);x.fillRect(px+26,yy+6,6,6);
  it=it.filter(o=>{o.y+=o.v;x.fillStyle=o.s?'#a05cff':'#ffd23f';x.fillRect(o.x,o.y,16,16);if(o.x<px+40&&o.x+16>px&&o.y+16>yy&&o.y<yy+22){o.s?lv--:sc++;return false}return o.y<430});
  x.fillStyle='#fff';x.font='16px monospace';x.fillText('★ '+sc+'   ♥ '+lv,10,22);
  if(lv<=0){over=true;let m='Score: '+sc;if(sc>=15&&S.lg!=today()){S.lg=today();addPts(10,'Daily game reward');m+=' · +10 points!'}box.innerHTML='<h3>Game over</h3><p>'+m+'</p><button class="pri" id="sg2">Play again</button>';$('#sg2').onclick=startGame;return}requestAnimationFrame(loop)})()}

let last=Date.now();['click','keydown','touchstart','pointermove'].forEach(e=>addEventListener(e,()=>last=Date.now(),{passive:true}));
setInterval(()=>{if(!S.nick||document.hidden||Date.now()-last>120000)return;const b=Math.floor(S.ms/1200000);S.ms+=1000;if(Math.floor(S.ms/1200000)>b){addPts(5,'20 minutes of active use');toast('+5 ORVYN POINTS')}if(S.ms%10000==0)save();const p=$('#bp');if(p){p.style.width=(S.ms%1200000)/12000+'%';$('#bm').textContent=Math.ceil((1200000-S.ms%1200000)/60000)+' min of active use to go'}},1000);
